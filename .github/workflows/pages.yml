# Build the viewer and publish it to GitHub Pages on every push to master.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
# The data the viewer reads (viewer/public/data/*.pmtiles, index.json, charts.json) is
# committed, so a push after `python3 make_viewer_data.py` publishes the new results.
name: Publish viewer to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "viewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
