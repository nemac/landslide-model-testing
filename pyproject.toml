[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-model-testing"
version = "0.1.0"
description = "Testing and evaluation of landslide susceptibility models"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dave Michelson", email = "dmichels@unca.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
